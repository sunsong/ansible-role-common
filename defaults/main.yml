---
# Define some defaults to choose whether or not to run some of the operations
# For legacy purpose - enable everything.
enable_hostname: true
enable_packages: true
enable_users: true
enable_kernel: true
enable_git: true
enable_ssh: true
enable_misc: true
enable_swapfile: false
enable_zram: false
zram_algorithm: lz4
zram_size_percent: 50
zram_priority: 100
swapfile_priority: 10

#
# Git related
#
common_git_user_name: User Name
common_git_user_email: user@example.com

#
# Packages (Debian/Ubuntu only — RedHat-family support was dropped in v2).
# chrony is the default time-sync daemon on both targets; ntp is unavailable
# on modern Debian/Ubuntu. No selinux bindings — Debian/Ubuntu use AppArmor.
#
common_packages_debian:
  - htop
  - sysstat
  - atop
  - git
  - chrony
  - dnsutils
  - iotop
  - wget

#
# Users
#
common_users: []
#    - name: myuser
#      sudo: yes
#      ssh: yes
#      authorized:
#          - ssh-rsa AAAAAxxxx
#          - https://github.com/myuser.keys

#
# Kernel
#
# /etc/security/limits.conf entries. Applied unconditionally; if `user` is
# omitted, the limit applies to the wildcard `*`.
common_limits:
  - name: nofile
    value: 65536
    user: root
    type:
      - hard
      - soft
  - name: nofile
    value: 65536
    user: '*'
    type:
      - hard
      - soft

#
# Sysctl tunables. Applied by tasks/kernel.yml using ansible.posix.sysctl
# with sysctl_set=yes, reload=yes, sysctl_file=/etc/sysctl.d/99-common.conf,
# and ignoreerrors=yes — i.e. values are written to /etc/sysctl.d/ AND
# applied at runtime, missing keys (e.g. tcp_tw_recycle on 4.12+) are skipped.
#
# Notes on individual keys:
#   - vm.swappiness defaults to 1, or 100 when zram is enabled. Override this
#     key in common_sysctl to tune swap behavior for a specific workload.
#   - net.ipv4.tcp_tw_recycle was removed from Linux 4.12+ (Debian 13 kernel
#     is 6.12 LTS). Setting it is a no-op on modern kernels; kept here at 0
#     because some older tooling greps for it.
#   - fs.inotify.* raised for dev workloads (Node, IDEs, Docker daemons)
#     hitting the default 8192/128 limits.
#
common_sysctl:
  vm.swappiness: "{{ 100 if enable_zram else 1 }}"
  kernel.panic: 60
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.all.arp_announce: 2
  net.ipv4.conf.all.arp_ignore: 1
  net.ipv4.ip_local_port_range: '1024 65535'
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_max_syn_backlog: 65536
  net.ipv4.tcp_tw_recycle: 0
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_keepalive_time: 1200
  net.ipv4.tcp_keepalive_intvl: 15
  net.ipv4.tcp_keepalive_probes: 5
  net.ipv4.tcp_fin_timeout: 30
  net.core.netdev_max_backlog: 32768
  net.core.somaxconn: 32768
  # inotify limits — see "too many open files" workaround above.
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 8192
  # net.ipv4.icmp_echo_ignore_broadcasts: 1
  # net.ipv4.icmp_ignore_bogus_error_responses: 1
  # net.ipv4.conf.all.accept_redirects: 0
  # net.ipv4.conf.all.rp_filter: 0
  # fs.file-max: 262144
  # net.ipv4.tcp_timestamps: 0
  # net.ipv4.tcp_synack_retries: 2
  # net.ipv4.tcp_syn_retries: 2
  # net.nf_conntrack_max: 262144
  # net.netfilter.nf_conntrack_max: 262144
  # net.netfilter.nf_conntrack_log_invalid: 0
  # net.netfilter.nf_conntrack_generic_timeout: 600
  # net.netfilter.nf_conntrack_checksum: 1

#
# SSH server hardening.
#
# Applied as a drop-in at /etc/ssh/sshd_config.d/00-common.conf via
# templates/sshd_common.conf.j2. Drop-ins are included by the stock
# /etc/ssh/sshd_config on Debian 13+ / Ubuntu 24.04+ via:
#   Include /etc/ssh/sshd_config.d/*.conf
#
# Each key corresponds 1:1 to an sshd_config directive. Set a value to `null`
# to omit the directive (use distro default); set a string/list to override.
# Settings that harden vs distro defaults (e.g. `permit_root_login`,
# `max_auth_tries`) ship with safe values; settings that may break workflows
# (e.g. `password_authentication`, `allow_tcp_forwarding`) ship as `null`
# (no change) so operators opt in explicitly.
#
# Quirks / things to know:
#   - `password_authentication: false` will lock out any account that does
#     not have an authorized_key deployed. Make sure `common_users[*].authorized`
#     is populated, or your cloud image's default user has a key, before
#     flipping this.
#   - `allow_tcp_forwarding: false` breaks SSH jumphost / `ssh -L` / `ssh -R`
#     patterns. Leave `null` if the host is a bastion.
#   - The `restart ssh` handler in handlers/main.yml runs `/usr/sbin/sshd -t`
#     before restart, so a typo in this file cannot lock you out.
#   - On Debian 13 / Ubuntu 26.04 with OpenSSH 9.6+/10.x, the algorithm
#     defaults (ciphers/macs/kex) are already modern. Override only for
#     compliance reasons.
#
ssh_hardening:
  # Authentication
  permit_root_login: 'no'                    # use a regular SSH account and sudo
  password_authentication: null              # null = leave distro default (yes on Debian); set false to require keys
  kbd_interactive_authentication: null      # null = leave distro default
  pubkey_authentication: true                # always on
  permit_empty_passwords: false              # always off
  max_auth_tries: 3                          # was: 6
  login_grace_time: 60                       # was: 120
  # Forwarding
  x11_forwarding: false                      # was: yes
  allow_tcp_forwarding: null                 # null = leave distro default (yes); set false to disable
  allow_agent_forwarding: true               # sudoers drops SSH_AUTH_SOCK into env_keep, so agent forwarding is needed
  allow_stream_local_forwarding: null        # null = leave distro default
  # Session hardening
  client_alive_interval: 300                 # was: 0 (disabled); 5 min keepalive
  client_alive_count_max: 2                  # was: 3; combined with 300s = 10 min idle timeout
  max_sessions: 10                           # was: 10 (no change); kept explicit
  max_startups: "10:30:100"                  # was: "10:30:100" (no change); kept explicit
  # Network hardening
  use_dns: false                             # already enforced by the role pre-hardening
  gssapi_authentication: false               # already enforced by the role pre-hardening
  gssapi_cleanup_credentials: true           # keep on; cleans up after GSSAPI sessions
  # Algorithms — leave null to use distro defaults (already modern on
  # OpenSSH 9.6+). Override only for compliance reasons.
  ciphers: null
  macs: null
  kex_algorithms: null
  # Access control — leave null unless you want to restrict which users/groups
  # can ssh in. WARNING: setting either of these to a wrong value will lock
  # you out. Use at your own risk.
  allow_users: null
  allow_groups: null
  deny_users: null
  deny_groups: null
  # Banner
  banner: /etc/issue.net                      # path; the file is created by the role if missing

#
# Misc
#
enable_ipv6: true

timezone: Asia/Shanghai

bash_history_size: 10000
bash_history_format: '%Y-%m-%d %T '

swap_size: 2048  # 2G
swap_path: /swapfile
