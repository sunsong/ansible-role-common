---
#
# Create a swap file at {{ swap_path }} (default /swapfile).
#
# Quirks:
#   - `fallocate -l` allocates the swap file's blocks instantly (no actual I/O)
#     instead of writing zeros synchronously like `dd if=/dev/zero`. On a 4G
#     swap this drops from ~30s to <1s. Supported on ext4 / xfs since kernel
#     3.5 (Linux 5.8+ handles btrfs). Debian 13 (kernel 6.12 LTS) and Ubuntu
#     26.04 both support it on the default root filesystem.
#   - Some filesystems (zfs, overlayfs) do NOT support fallocate. On a ZFS
#     root, fallocate fails with "fallocate failed: Operation not supported"
#     and you must fall back to `dd`. Detect this in the rescue block below.
#   - `mkswap` does NOT require the file to contain zeros; it works on a
#     fallocate-allocated file directly. Some old guides say to use dd because
#     older kernels required non-sparse swap, but 4.0+ kernels are happy with
#     fallocate.
#   - The fstab entry uses ansible.posix.mount with `state: present` which is
#     idempotent.
#   - `swapon -a` activates all swap entries in fstab, including any the
#     operator added manually. Use `swapon {{ swap_path }}` to be surgical.
#   - Optional compressed RAM swap is configured separately in tasks/zram.yml
#     using the distro's zram-tools package.
#   - ansible.posix.mount is in the ansible.posix collection, NOT ansible.builtin.
#
- name: Check if swapfile already exists
  ansible.builtin.stat:
    path: "{{ swap_path }}"
    get_checksum: false
  register: swapfile_stat

- name: Create swap file via fallocate
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size }}M {{ swap_path }}"
    creates: "{{ swap_path }}"
  register: fallocate_result
  changed_when: not swapfile_stat.stat.exists
  failed_when: false
  when: not swapfile_stat.stat.exists

- name: Fall back to dd if fallocate is unsupported (e.g. ZFS root)
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ swap_path }} count={{ swap_size }} bs=1MiB"
  when:
    - not swapfile_stat.stat.exists
    - fallocate_result is defined
    - fallocate_result.rc is defined
    - fallocate_result.rc != 0
  changed_when: true

- name: Lock down swap file permissions
  ansible.builtin.file:
    path: "{{ swap_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command:
    cmd: "mkswap {{ swap_path }}"
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Ensure swapfile is in /etc/fstab
  ansible.posix.mount:
    name: swap
    src: "{{ swap_path }}"
    fstype: swap
    opts: "{{ 'pri=' ~ swapfile_priority if enable_zram else omit }}"
    state: present

- name: Activate swap
  ansible.builtin.command:
    cmd: swapon -a
  changed_when: false
