---
#
# sshd hardening — Debian/Ubuntu only. Service is always `ssh` on these
# distros (the RedHat `sshd` distinction is gone with RedHat support).
#
# Strategy:
#   - Deploy a managed drop-in at /etc/ssh/sshd_config.d/00-common.conf
#     via templates/sshd_common.conf.j2. The stock sshd_config on
#     Debian 13+ / Ubuntu 24.04+ includes everything in that directory, so
#     our directives take effect without editing the main config.
#   - Generate a banner at /etc/issue.net (Pre-login banner) when
#     ssh_hardening.banner is set. The role creates the file only if missing;
#     an existing banner is left untouched.
#   - The drop-in is validated with `sshd -t -f` before it is written; the
#     "Restart ssh" handler validates the full config again before restarting.
#
# Quirks:
#   - The pre-hardening lineinfile tasks for UseDNS / GSSAPIAuthentication
#     were removed when the template was introduced — the template emits
#     those directives directly. If you set ssh_hardening.use_dns or
#     ssh_hardening.gssapi_authentication to null, the template omits them
#     and the distro default applies (UseDNS=yes, GSSAPIAuthentication=no
#     on Debian 13).
#   - `sshd -T` validates the config and prints the EFFECTIVE values. Use
#     `sudo sshd -T | grep <directive>` to verify the drop-in landed.
#
- name: Deploy sshd_config.d drop-in
  ansible.builtin.template:
    src: sshd_common.conf.j2
    dest: /etc/ssh/sshd_config.d/00-common.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure pre-login banner file exists
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_effective.banner }}"
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      ********************************************************************
      * Authorized access only. All activity is monitored and recorded.   *
      * Disconnect immediately if you are not an authorized user.        *
      ********************************************************************
  when: ssh_hardening_effective.banner is not none
