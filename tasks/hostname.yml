---
#
# Resolve the existing short hostname to IPv4 loopback without renaming the host.
#
# Quirks:
#   - On Ubuntu 24.04+ cloud images, cloud-init owns /etc/hosts and may
#     overwrite these changes on next boot.
#   - Debian commonly maps its hostname to 127.0.1.1. That entry is removed
#     so the hostname resolves consistently to 127.0.0.1.
#
- name: Remove Debian non-loopback hostname mapping
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+(?:\S+\s+)*{{ ansible_facts.hostname | regex_escape }}(\s|$)'
    state: absent

- name: Ensure the current hostname resolves to IPv4 loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 localhost {{ ansible_facts.hostname }}"
    regexp: '^127\.0\.0\.1\s+.*localhost'
    state: present

- name: Keep IPv6 loopback aliases limited to localhost
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "::1 localhost ip6-localhost ip6-loopback"
    regexp: '^::1\s+'
    state: present
  when: enable_ipv6
