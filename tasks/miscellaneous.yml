---
#
# OS-agnostic misc: bash history + LESS charset. The RedHat-specific tasks
# (firewalld, NetworkManager, tzdata) were dropped with RedHat-family support.
#
- name: Configure bash history size and format
  ansible.builtin.copy:
    dest: /etc/profile.d/99-bash_history.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export HISTTIMEFORMAT="{{ bash_history_format }}"
      export HISTFILESIZE={{ bash_history_size }}
  when: enable_misc

- name: Configure LESS charset
  ansible.builtin.copy:
    dest: /etc/profile.d/99-less.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export LESSCHARSET=utf-8
  when: enable_misc

- name: Configure timezone via systemd
  ansible.builtin.include_tasks: miscellaneous-debian.yml
  when: enable_misc
