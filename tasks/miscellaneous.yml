---
#
# Shared miscellaneous settings for supported Debian and Ubuntu hosts.
# RedHat-specific tasks (firewalld, NetworkManager, tzdata) were dropped.
#
- name: Configure bash history size and format
  ansible.builtin.copy:
    dest: /etc/profile.d/99-bash_history.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export HISTTIMEFORMAT="{{ bash_history_format }}"
      export HISTFILESIZE={{ bash_history_size }}

- name: Configure LESS charset
  ansible.builtin.copy:
    dest: /etc/profile.d/99-less.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export LESSCHARSET=utf-8

- name: Read current timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: current_timezone
  changed_when: false
  when: timezone is not none

- name: Set timezone via timedatectl
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ timezone }}"
  when:
    - timezone is not none
    - current_timezone.stdout != timezone
  changed_when: true

- name: Ensure chrony service is started and enabled
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
    use: service
