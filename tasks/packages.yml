---
#
# Package installation — Debian/Ubuntu only (RedHat-family support dropped).
# The legacy `include_tasks: packages-debian.yml when os_family == 'Debian'`
# pattern is unnecessary now: the role is Debian-only by definition.
#
- name: Update apt cache and run safe upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe  # `safe` == `apt upgrade`; `dist` would do `apt full-upgrade`
  when: enable_packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present
  when: enable_packages
