---
#
# Kernel / sysctl / ulimit tuning for Debian-family hosts.
#
# RedHat-family support (SELinux, EPEL, firewalld, NetworkManager) was dropped
# in v2 — see docs/UPGRADE_CHECKLIST.md.
#
# Quirks:
#   - net.ipv4.tcp_tw_recycle was removed from the Linux kernel in 4.12;
#     Debian 13 ships 6.12 LTS so the file does not exist. The sysctl task
#     uses `ignoreerrors: true` to skip unknown keys silently. Kept at 0 in
#     defaults because some monitoring tooling still greps for it.
#   - The sysctl module writes to /etc/sysctl.d/99-common.conf (set via
#     `sysctl_file:`) AND applies immediately via `sysctl_set=yes reload=yes`.
#     Files in /etc/sysctl.d/ are applied at boot by systemd-sysctl.service
#     in alphanumeric order; the 99-prefix ensures we win against any
#     distro-shipped defaults.
#   - ansible.posix.sysctl defaults to /etc/sysctl.conf if `sysctl_file:` is
#     not set. /etc/sysctl.conf is legacy and read once at boot on most
#     systems; sysctl.d/ drop-ins are the modern pattern.
#   - limits.conf is parsed by PAM (pam_limits.so). systemd services that do
#     not go through PAM (most of them on Debian 13/Ubuntu 26.04) ignore it.
#     If you need a system-wide fd limit for systemd units, see
#     templates/systemd_openfile.conf.
#   - ansible.posix.sysctl lives in the ansible.posix collection. It is NOT
#     in ansible.builtin despite looking like it should be — module migration
#     history.
#

- name: Apply ulimit entries in /etc/security/limits.conf
  ansible.builtin.lineinfile:
    dest: /etc/security/limits.conf
    line: "{{ item.0.user }} {{ item.1 }} {{ item.0.name }} {{ item.0.value }}"
    state: present
  loop: "{{ common_limits | subelements('type') }}"

- name: Apply sysctl tunables from defaults
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
    ignoreerrors: true
    sysctl_file: /etc/sysctl.d/99-common.conf
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
